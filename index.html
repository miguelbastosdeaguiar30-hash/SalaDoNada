<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALA DO NADA™</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<section id="auth" class="panel center"><h1>SALA DO NADA™</h1><p>Um lugar para ficar. Só isso.</p>
<input id="email" type="email" placeholder="E-mail" autocomplete="email">
<input id="pass" type="password" placeholder="Senha (mín. 6)" autocomplete="current-password">
<input id="uname" placeholder="Como você quer ser chamado? (só no cadastro)" maxlength="16">
<div class="row"><button id="login">Entrar</button><button id="signup" class="alt">Criar conta</button></div>
<button id="reset" class="link">Esqueci a senha</button><p id="err" class="err"></p></section>
<section id="menu" class="panel center hidden"><h2 id="hello"></h2><p id="coins"></p>
<label>Sua cor <input id="color" type="color" value="#ff7a3d"></label>
<button id="create">Criar sala</button>
<div class="row"><input id="code" placeholder="Código" maxlength="6"><button id="join" class="alt">Entrar</button></div>
<button id="out" class="link">Sair da conta</button><p id="merr" class="err"></p></section>
<div id="hud" class="hidden"><div id="top"><b id="rc"></b><button id="cp">copiar código</button><span id="pc"></span><button id="leave">sair</button></div>
<div id="emotes"><button data-e="wave">1 acenar</button><button data-e="laugh">2 rir</button><button data-e="point">3 apontar</button><button data-e="dance">4 dançar</button></div>
<div id="toast"></div><div id="chat"><div id="log"></div><input id="msg" maxlength="200" placeholder="Enter para falar"></div>
<p id="help">WASD andar · Shift correr · Espaço pular · arraste para girar · clique nos objetos · E empurra/interage</p></div>
<script type="module" src="js/main.js"></script></body></html>
