<style>

button{padding:11px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ff9158,var(--acc));font-weight:700;cursor:pointer;box-shadow:0 4px 0 #c24a14,0 8px 16px rgba(0,0,0,.25);transition:transform .12s,filter .2s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #c24a14}
button.alt{background:linear-gradient(180deg,#7ff3df,#2fc7ad);box-shadow:0 4px 0 #168b78,0 8px 16px rgba(0,0,0,.25);color:#06352d}

<div class="grp"><button id="bf" title="Rosto">😀<kbd>F</kbd></button><button id="ba" title="Acessório">🎩<kbd>G</kbd></button><button id="bx" title="Efeito">✨<kbd>H</kbd></button></div>
<div class="grp"><button id="be" title="Interagir / carro">🖐<kbd>E</kbd></button><button id="bc" title="Gerar carro">🚗<kbd>B</kbd></button><button id="bcl" title="Limpar meus carros">🧹</button><button id="bh" title="Casa">🏠<kbd>C</kbd></button><button id="bed" title="Editar casa">🎨<kbd>V</kbd></button><button id="bu" title="Música da festa">🎵</button><button id="bv" class="pill">Voz: desligada</button><button id="bm" class="pill hidden">Mutar (M)</button></div></div>
<div id="edit" class="panel center hidden"><b>🎨 Editar minha casa</b><label>Parede de fora <input id="ceo" type="color"></label><label>Telhado <input id="cer" type="color"></label><label>Parede de dentro <input id="cei" type="color"></label><label>Chão <input id="cef" type="color"></label><div class="row"><button id="crem">Remover</button><button id="cx" class="alt">Fechar</button></div></div><div id="toast"></div><div id="chat"><div id="log"></div><input id="msg" maxlength="200" placeholder="Enter para falar…"></div>

<script type="module">

// ---------- AUTH ----------

const showErr = (el, e) => { el.textContent = msgs[e.code] || e.message; };
$('login').onclick = async () => { $('err').textContent=''; try { await F.signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value); } catch(e){ showErr($('err'),e); } };

  } catch(e){ showErr($('err'),e); }
};

$('out').onclick = () => F.signOut(auth);
F.onAuthStateChanged(auth, async u => {
  user = u; $('auth').classList.toggle('hidden', !!u); $('menu').classList.toggle('hidden', !u);
  if (!u) return;
  const ref = F.doc(db,'users',u.uid); let s = null;
  try {
    s = await F.getDoc(ref);
    if (!s.exists()) { // conta sem perfil (ex.: cadastro interrompido): cria o perfil inicial
      await F.setDoc(ref,{ uid:u.uid, username:'Visitante'+Math.floor(Math.random()*999), coins:100, equippedColor:'#ff7a3d', createdAt:F.serverTimestamp(), lastLogin:F.serverTimestamp() });

  } catch(e) { $('merr').textContent = 'Firestore negou acesso: publique as regras do Firestore (firestore.rules). '+e.message; }
  profile = (s && s.exists()) ? s.data() : { username:'Visitante', coins:0, equippedColor:'#ff7a3d' };
  $('hello').textContent = 'Oi, '+profile.username; $('coins').textContent = '🪙 '+profile.coins+' moedas';
  $('color').value = profile.equippedColor || '#ff7a3d';
});
$('color').onchange = () => { profile.equippedColor = $('color').value; F.updateDoc(F.doc(db,'users',user.uid),{ equippedColor:$('color').value }).catch(()=>{}); };

// ---------- SALAS ----------
const rand = () => { const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join(''); };
$('create').onclick = async () => {
  try { const code = rand();
    await F.set(F.ref(rtdb,`rooms/${code}/meta`),{ host:user.uid, createdAt:F.serverTimestamp() });
    enter(code);
  } catch(e){ $('merr').textContent = 'Erro ao criar sala: '+e.message; }
};
$('join').onclick = async () => {
  const code = $('code').value.trim().toUpperCase();
  try { const s = await F.get(F.ref(rtdb,`rooms/${code}/meta`));
    if (!s.exists()) { $('merr').textContent='Sala inexistente.'; return; }
    enter(code);
  } catch(e){ $('merr').textContent = 'Erro: '+e.message; }
};
$('cp').onclick = () => navigator.clipboard?.writeText(room).then(()=>toast('Código copiado'));
$('leave').onclick = async () => { await F.remove(F.ref(rtdb,`rooms/${room}/players/${user.uid}`)).catch(()=>{}); location.reload(); };
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }

function enter(code) {
  room = code; $('menu').classList.add('hidden'); $('hud').classList.remove('hidden'); $('rc').textContent = 'Sala '+code;
  game = startGame(code);
}

// ---------- JOGO ----------
const ACC=['nenhum','chapéu','óculos','coroa','nariz','cone'], EXPR=['normal','feliz','triste','bravo','assustado','rindo'], FXN=['nenhum','aura','brilhos'];
const KEYE={'1':'wave','2':'point','3':'cheer','4':'no','5':'sit','6':'dance1','7':'dance2','8':'dance3'};
const GEST=['wave','point','cheer','no'];
const FACE=[[1,.2,0,1],[1.2,1,Math.PI,1],[1,1,0,1],[1,.6,0,.5],[.8,1.4,0,1.7],[1.7,1.7,Math.PI,.4]]; // mouth sx,sy,rotZ,eyeScaleY
const DEFS=[
['BOTÃO ABSOLUTAMENTE IMPORTANTE','Nada aconteceu.','b',5,-6,0xff4444,440],['Não aperte.','...','b',-5,-6,0xffffff,120],
['Campainha','Ninguém veio.','b',12,-12,0xffd37a,880],['Máquina de refrigerante','Sem troco. Sem refrigerante.','m',-12,-12,0xe63946,200],
['Televisão','Está passando o canal do Nada.','t',-14,6,0x222222,330],['Interruptor','Click. A luz continua igual.','b',14,6,0xeeeeee,600],
['Telefone','Chamando... a linha é a Sala.','b',0,13,0x2a9d8f,520],['Lixeira','Já estava vazia. Agora também.','m',-8,14,0x666666,150],
['Micro-ondas','Plim! Dentro: nada, bem quentinho.','m',9,14,0xcccccc,1000],['Placa','"Esta placa é uma placa."','m',-18,-4,0xb07a3b,260],
['Porta aleatória','Rangeu. Do outro lado, nada.','d',-34,12,0x7b4f2a,180],['Outra porta','Também nada. Mas mais alto.','d',34,-30,0x4f7b2a,180],
['Gaveta','Dentro: outra gaveta (de mentira).','w',-30,-10,0x9c6b3a,300],['Gaveta','Vazia. Cheirando a nada.','w',20,34,0x9c6b3a,300],
['Alavanca','Você puxou. O mundo concorda.','b',-20,26,0x888888,350],['Botão gigante','Você sente que algo mudou. Nada mudou.','b',0,-34,0xff7a3d,90],
['Máquina estranha','Ela zumbiu e cuspiu um "obrigado".','m',30,26,0x7e57c2,700],['Vaso','Uma planta fingindo ser útil.','m',16,-4,0x6a994e,240],
['Caixa de som','BUUUM. (baixinho)','m',-26,30,0x333333,70],['Estátua misteriosa','Ela te encara. Você a encara.','m',44,0,0xbbbbbb,160],
['Segredo dourado','Você achou um segredo. Não vale nada. Parabéns.','m',-46,-38,0xffd700,990]];
let AC=null; const getAC=()=>{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; };
const beep=f=>{ try{ const c=getAC(),o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=.04; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.12);}catch(e){} };

function startGame(code) {
  const renderer = new THREE.WebGLRenderer({ canvas:$('c'), antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1;

  const B=THREE.BoxGeometry, Cy=THREE.CylinderGeometry, Sp=THREE.SphereGeometry;

  const cvT=(w,h,fn,rx=1,ry=1)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=4; return t; };
  const grain=(x,w,h,n,a)=>{ for(let i=0;i<n;i++){ x.fillStyle=Math.random()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`; x.fillRect(Math.random()*w,Math.random()*h,2,2); } };
  const grassT=cvT(256,256,(x,w,h)=>{ x.fillStyle='#8fd9a8'; x.fillRect(0,0,w,h); for(let i=0;i<800;i++){ x.strokeStyle=Math.random()<.5?'rgba(50,140,85,.35)':'rgba(200,255,205,.3)'; x.beginPath(); const a=Math.random()*w,b=Math.random()*h; x.moveTo(a,b); x.lineTo(a+2,b-6); x.stroke(); } grain(x,w,h,400,.05); },44,44);

  const PAVE=cvT(256,256,(x,w,h)=>{ x.fillStyle='#efe0ae'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(120,90,40,.35)'; x.lineWidth=2; for(let r=0;r<8;r++){ const y=r*32; x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke(); for(let c=0;c<8;c++){ const xx=c*32+(r%2?16:0); x.beginPath(); x.moveTo(xx,y); x.lineTo(xx,y+32); x.stroke(); } } grain(x,w,h,900,.07); });
